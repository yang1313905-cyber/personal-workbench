[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-workbench"
version = "0.1.0"
description = "个人智能工作台：模块化 Agent 框架，首个模块为每日新闻简报（抓取-蒸馏-推送）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0.10",
    "PyYAML>=6.0",
    "APScheduler>=3.10,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.41",
    "ruamel.yaml>=0.18",
]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
include = ["workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
