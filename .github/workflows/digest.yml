# 每日新闻简报 · GitHub Actions 云调度（免费，电脑无需开机）
#
# 工作方式：每天定时在 GitHub 服务器上运行 `workbench digest`
#           → 抓取新闻 → LLM 蒸馏（智谱 GLM-4-Flash）→ 推送邮件（QQ SMTP → QQ 邮箱）
#
# 一次性配置：
#   1. 推送本项目到 GitHub（私有仓库）
#   2. 在仓库 Settings → Secrets and variables → Actions → New repository secret 添加：
#        LLM_API_KEY      你的智谱 API Key（open.bigmodel.cn 获取）
#        SMTP_USER        you@qq.com
#        SMTP_PASSWORD    QQ 邮箱授权码（16 位）
#        SMTP_FROM        you@qq.com
#        SMTP_TO          you@qq.com
#   3. 推送后 Actions 按 cron 自动执行；也可在 Actions 页手动 Run workflow 立即测试
name: daily-digest

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = 北京时间 08:00（Actions 用 UTC 时间）
  workflow_dispatch:      # 支持在 Actions 页面手动触发

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate digest & push email
        run: python -m workbench.cli digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
