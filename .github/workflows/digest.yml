# 每日新闻简报 · GitHub Actions 云端调度
#
# 为什么放在云端：由 GitHub 的服务器执行，本地电脑关机 / 睡眠 / 断网 / 不在身边
# 都不影响北京时间 08:00 准时收到邮件。
#
# 【定时】
#   cron 使用 UTC：00:00 UTC = 北京时间 08:00；00:30 UTC 为一次重试。
#   入口脚本 scripts/daily_digest.py 是幂等的：当天已成功送达邮件则自动跳过，
#   因此重试、误触发都不会造成重复邮件；而 08:00 那次因网络失败时会真正重发。
#   注：GitHub 的定时任务在高峰期可能延迟数分钟到数十分钟，属正常现象。
#
# 【状态持久化】
#   Actions 每次运行都是全新容器，工作区不留痕。因此用 actions/cache 缓存 data/ 目录，
#   跨天复用两个关键状态：① 跨天去重历史（避免连续几天报道同一条旧闻）
#   ② 当天是否已成功发送（保证重试幂等）。
#
# 【一次性配置】仓库 Settings → Secrets and variables → Actions → New repository secret
#   LLM_API_KEY      智谱 API Key（open.bigmodel.cn）
#   SMTP_USER        you@qq.com
#   SMTP_PASSWORD    QQ 邮箱 SMTP 授权码（16 位，非登录密码）
#   SMTP_FROM        you@qq.com
#   SMTP_TO          you@qq.com
name: daily-digest

on:
  schedule:
    - cron: "0 0 * * *"     # 北京时间 08:00
    - cron: "30 0 * * *"    # 北京时间 08:30 重试（已发送则跳过）
  workflow_dispatch:        # 支持在 Actions 页手动触发
    inputs:
      force:
        description: "忽略“当天已发送”记录，强制重发一封"
        type: boolean
        default: false

permissions:
  contents: read

# 同一时间只跑一个，避免重试与定时重叠
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: wb-state-${{ github.run_id }}
          restore-keys: |
            wb-state-

      # 定时路径与手动路径拆成两个 step，正常路径不含任何表达式，
      # 避免 schedule 事件下 inputs 上下文缺失导致无人值守的定时运行直接失败。
      - name: Generate digest and send email
        if: ${{ github.event.inputs.force != 'true' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TZ: Asia/Shanghai
        run: python scripts/daily_digest.py

      - name: Generate digest and send email (forced resend)
        if: ${{ github.event.inputs.force == 'true' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          TZ: Asia/Shanghai
        run: python scripts/daily_digest.py --force

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: wb-state-${{ github.run_id }}

      - name: Upload digest archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: data/output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Show digest in run summary
        if: always()
        run: |
          f="$(ls -t data/output/digest-*.md 2>/dev/null | head -1 || true)"
          if [ -n "${f}" ]; then
            cat "${f}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次未生成简报（可能因当天已发送而跳过）" >> "$GITHUB_STEP_SUMMARY"
          fi
